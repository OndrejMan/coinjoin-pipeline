# Manual invocation only. CPU/RAM are starting budgets, not measured mainnet minima.
action: mainnet-sync
run_id: mainnet-sync-CHANGE-ME
# The state prefix and backups are fixed: every run replaces the previous one's state
# and backups, and keeps only its logs under <state_uri>/logs/<run_id>/.
artifacts:
  backend: s3
  endpoint_url: https://s3.cl4.du.cesnet.cz
  credentials_file: /storage/brno2/home/xman/.aws/credentials
  profile: coinjoin
mainnet:
  # Recommended minimum for a run exercising Dumplings (starts at height 336861).
  # Omit for the current tip. Actual frozen height can be higher.
  target_height: 400000
  root: /scratch/multijob-brno/xman/bitcoin-mainnet
  state_uri: s3://xman-coinjoin-new/bitcoin-mainnet/sync
  backup_uri: s3://xman-coinjoin-new/bitcoin-mainnet/core-checkpoint
  blocks_uri: s3://xman-coinjoin-new/bitcoin-mainnet/blocks
  dumplings_uri: s3://xman-coinjoin-new/bitcoin-mainnet/dumplings
  # Use rebuilt images containing the changes in this workspace; pin them before deployment.
  core_image: ghcr.io/ondrejman/bitcoin-block-archive:latest
  dumplings_image: ghcr.io/ondrejman/dumplings:latest
  dbcache_mb: 8192
  reorg_reserve: 2016
blocksci:
  index_dir: /scratch/multijob-brno/xman/blocksci-mainnet
  index_backup_uri: s3://xman-coinjoin-new/bitcoin-mainnet/blocksci-index
# Four chained jobs: restore (fills an empty working dataset from S3, otherwise ends at
# once), producer, blocksci, and checkpoint (index backup, pruning and Core checkpoint).
pbs:
  restore:
    ncpus: 8
    mem: 8gb
    scratch: 20gb
    walltime: '12:00:00'
    multijob: brno
  producer:
    ncpus: 4
    mem: 16gb
    scratch: 20gb
    walltime: '24:00:00'
    multijob: brno
  blocksci:
    ncpus: 16
    mem: 256gb
    scratch: 20gb
    walltime: '24:00:00'
    multijob: brno
  checkpoint:
    ncpus: 16
    mem: 8gb
    scratch: 20gb
    walltime: '12:00:00'
    multijob: brno
