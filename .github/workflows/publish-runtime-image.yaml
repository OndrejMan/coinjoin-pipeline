name: Publish Runtime Image

# ghcr.io/ondrejman/coinjoin-pipeline-runtime: Python, the dependencies and the sources of
# one commit (container/runtime.Dockerfile). cj-frontend starts FROM it, pinned by digest,
# and Dependabot there proposes each new digest. Only commits whose Tests passed on main
# are published, so every proposed digest is a tested one.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runtime-image
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the runtime image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/runtime.Dockerfile
          build-args: |
            REVISION=${{ steps.revision.outputs.sha }}
          push: true
          tags: |
            ghcr.io/ondrejman/coinjoin-pipeline-runtime:latest
            ghcr.io/ondrejman/coinjoin-pipeline-runtime:${{ steps.revision.outputs.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Report the reference
        run: |
          reference="ghcr.io/ondrejman/coinjoin-pipeline-runtime:${{ steps.revision.outputs.sha }}@${{ steps.build.outputs.digest }}"
          echo "${reference}"
          echo "## Runtime image published" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
          echo "${reference}" >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
