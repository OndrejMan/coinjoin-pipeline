name: Publish Uploader Image

# Manual only, unlike the retired publish-pipeline-image workflow. The uploader
# is an immutable tool image pinned by digest in container/uploader.image; it
# changes when kubectl/s5cmd or the shell logic changes, not with every commit,
# so republishing on every push to main would be noise.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ondrejman/coinjoin-pipeline-uploader
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push uploader image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: container
          file: container/uploader.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

      # The digest is the artifact of this workflow. Updating
      # container/uploader.image is a deliberate follow-up commit, not an
      # automatic push, so the reason a referenced uploader changed stays
      # auditable in the history.
      - name: Report the immutable reference
        run: |
          reference="ghcr.io/ondrejman/coinjoin-pipeline-uploader@${{ steps.build.outputs.digest }}"
          echo "${reference}"
          {
            echo "## Uploader image published"
            echo
            echo 'Update `container/uploader.image` with:'
            echo
            echo '```'
            echo "${reference}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
