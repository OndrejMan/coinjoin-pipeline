name: Tests

# Every branch and every pull request gets the full suite. The `gate` job below
# keeps that from doubling the cost: once a branch has an open pull request, the
# pull_request run is the one that counts and the branch push run bows out.
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pull-requests: read

concurrency:
  group: coinjoin-pipeline-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Root gate: every other root job hangs off this, and a skipped job skips its
  # dependents, so one decision here governs the whole suite.
  gate:
    runs-on: [self-hosted, x64]
    outputs:
      should-run: ${{ steps.decide.outputs.should-run }}

    steps:
      - name: Decide whether this event owns the run
        id: decide
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'push') {
              core.info(`${context.eventName} event: always runs.`);
              core.setOutput('should-run', 'true');
              return;
            }

            if (!context.ref.startsWith('refs/heads/')) {
              core.info(`${context.ref} is not a branch: skipping.`);
              core.setOutput('should-run', 'false');
              return;
            }

            const branch = context.ref.slice('refs/heads/'.length);
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
              per_page: 1,
            });

            if (pulls.length > 0) {
              core.info(`Branch ${branch} is already covered by PR #${pulls[0].number}: skipping the push run.`);
              core.setOutput('should-run', 'false');
              return;
            }

            core.info(`Branch ${branch} has no open pull request: running.`);
            core.setOutput('should-run', 'true');

  configuration-unit-tests:
    runs-on: [self-hosted, x64]
    needs: gate
    if: needs.gate.outputs.should-run == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          python3 --version
          python3 - <<'PY'
          import sys

          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"Expected Python 3.14, got {sys.version}")
          PY

      - name: Run configuration unit tests
        run: |
          uv sync --frozen --extra test
          uv run --extra test pytest -q tests/unit tests/pipeline

      - name: Run static checks
        run: uv run lint --check

  podman-wrapper:
    runs-on: [self-hosted, x64]
    needs: configuration-unit-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Python
        run: |
          python3 --version
          python3 - <<'PY'
          import sys

          if sys.version_info[:2] != (3, 14):
              raise SystemExit(f"Expected Python 3.14, got {sys.version}")
          PY

      - name: Run runIt overactive-local dry test
        run: ./tests/test-runIt-overactive-local.sh

      - name: Run Podman wrapper dry test
        run: ./tests/test-podman-no-host-docker.sh

  docker-overactive-local:
    runs-on: [self-hosted, x64]
    needs: podman-wrapper
    env:
      KUBECTL_VERSION: v1.35.6
      K3D_VERSION: v5.9.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run overactive-local through real Docker
        env:
          CONTAINER_RUNTIME: docker
          EMULATION_LOGS_DIR: ${{ runner.temp }}/coinjoin-pipeline-docker-emulation-logs
        run: ./tests/test-runIt-overactive-local-docker.sh

  podman-overactive-local:
    runs-on: [self-hosted, x64]
    needs: podman-wrapper
    if: needs.gate.outputs.should-run == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR for Podman
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run complete overactive-local pipeline through real Podman
        env:
          CONTAINER_RUNTIME: podman
          EMULATION_LOGS_DIR: ${{ runner.temp }}/coinjoin-pipeline-podman-emulation-logs
        run: ./tests/test-runIt-overactive-local-podman.sh

  docker-joinmarket:
    runs-on: [self-hosted, x64]
    needs: podman-wrapper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run JoinMarket through real Docker with upstream images
        env:
          CONTAINER_RUNTIME: docker
          EMULATION_LOGS_DIR: ${{ runner.temp }}/coinjoin-pipeline-joinmarket-emulation-logs
        run: ./tests/test-runIt-joinmarket-local-docker.sh

  docker-parallel:
    runs-on: [self-hosted, x64]
    needs: podman-wrapper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run overactive-local through real Docker with --parallel
        env:
          CONTAINER_RUNTIME: docker
          EMULATION_LOGS_DIR: ${{ runner.temp }}/coinjoin-pipeline-parallel-emulation-logs
        run: ./tests/test-runIt-parallel-local-docker.sh

  kubernetes-k3d:
    runs-on: [self-hosted, x64]
    needs:
      - docker-overactive-local
      - docker-joinmarket
      - docker-parallel
    env:
      KUBECTL_VERSION: v1.35.6
      K3D_VERSION: v5.9.0
      COINJOIN_EMULATOR_SOURCE_DIR: ${{ github.workspace }}/coinjoin-emulator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout emulator build sources
        uses: actions/checkout@v4
        with:
          repository: OndrejMan/coinjoin-emulator
          path: coinjoin-emulator
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kubectl
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL -o "${RUNNER_TEMP}/bin/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          chmod 0755 "${RUNNER_TEMP}/bin/kubectl"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Install k3d
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -fsSL -o "${RUNNER_TEMP}/bin/k3d" "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          chmod 0755 "${RUNNER_TEMP}/bin/k3d"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Run k3d Kubernetes integration test
        env:
          CONTAINER_RUNTIME: docker
          EMULATION_LOGS_DIR: ${{ runner.temp }}/coinjoin-pipeline-emulation-logs
          WAIT_TIMEOUT: 240s
          EMULATION_TIMEOUT: 240m
        run: ./tests/test-kubernetes-k3d.sh
